spring:
  application:
    name: zerowiki-backend
  profiles:
    default: api
  datasource:
    url: ${ZEROWIKI_DB_URL:jdbc:postgresql://localhost:5432/zerowiki}
    username: ${ZEROWIKI_DB_USERNAME:zerowiki}
    password: ${ZEROWIKI_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: false

server:
  error:
    include-message: never

zerowiki:
  auth:
    access-token-seconds: 900
    refresh-token-days: 30
    refresh-cookie-name: refresh_token
    refresh-cookie-secure: ${ZEROWIKI_COOKIE_SECURE:true}
  jwt:
    secret: ${ZEROWIKI_JWT_SECRET:}
  storage:
    local-root: ${ZEROWIKI_LOCAL_OBJECT_ROOT:build/object-store}
    public-base-url: ${ZEROWIKI_UPLOAD_BASE_URL:http://localhost:8080}
  worker:
    poll-ms: ${ZEROWIKI_WORKER_POLL_MS:2000}
